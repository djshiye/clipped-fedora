name: CI

# Pushes and pull requests: format, lint and unit tests on Fedora 44, with
# the Cargo build cached between runs (a few minutes, mostly dnf).
# Version tags (v*): build the RPM once (its %check runs the Meson
# validation tests), publish the GitHub release, refresh the dnf repository,
# and attach a Flatpak bundle.
# Weekly: the same checks on Rawhide, to hear early about toolchain breakage.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    name: Check (Fedora ${{ github.event_name == 'schedule' && 'rawhide' || '44' }})
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    container:
      image: fedora:${{ github.event_name == 'schedule' && 'rawhide' || '44' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            rust cargo clippy rustfmt gcc gtk4-devel libadwaita-devel \
            sqlite-devel blueprint-compiler gettext

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test

  rpm:
    name: Build RPM (Fedora 44)
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            rust cargo meson ninja-build gcc gtk4-devel libadwaita-devel \
            sqlite-devel blueprint-compiler desktop-file-utils appstream gettext \
            rpm-build rpmdevtools rpmlint cargo-rpm-macros python3 tar xz

      - name: Build RPM
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME != Cargo.toml $VERSION"; exit 1; }
          # Build everything outside the checkout: tar refuses to archive a
          # directory that changes while it is read (its own output landing in it).
          DIST="$RUNNER_TEMP/dist"; mkdir -p "$DIST"
          cargo vendor --locked "$DIST/vendor" > /dev/null
          tar -C "$DIST" -cJf "$DIST/clipperino-${VERSION}-vendor.tar.xz" vendor
          tar --no-wildcards-match-slash \
              --exclude=./target --exclude=./.git --exclude=./spikes \
              --transform "s,^\./,clipperino-${VERSION}/," -czf "$DIST/clipperino-${VERSION}.tar.gz" .
          rpmdev-setuptree
          cp "$DIST"/clipperino-${VERSION}*.tar.* ~/rpmbuild/SOURCES/
          rpmbuild -ba build-aux/clipperino.spec
          rpmlint build-aux/clipperino.spec ~/rpmbuild/RPMS/x86_64/clipperino-*.rpm

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: clipperino-rpm-fedora-44
          path: ~/rpmbuild/RPMS/x86_64/clipperino-[0-9]*.rpm
          if-no-files-found: error

      # The spec downloads these from the release (Source0, Source1).
      - name: Upload source tarballs
        uses: actions/upload-artifact@v4
        with:
          name: clipperino-sources
          path: ~/rpmbuild/SOURCES/clipperino-*.tar.*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: rpm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Notes: this version's section of CHANGELOG.md.
          awk -v v="$VERSION" '
            $0 ~ "^## " v " " {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG.md section for $VERSION"; exit 1; }
          gh release create "$GITHUB_REF_NAME" \
            assets/clipperino-sources/* assets/clipperino-rpm-fedora-44/*.rpm \
            --repo "$GITHUB_REPOSITORY" \
            --title "Clipperino $VERSION" \
            --notes-file notes.md

  # Built beside the RPM, never in its way: the release and dnf repository
  # do not wait for it; the bundle is attached to the release afterwards.
  flatpak:
    name: Build Flatpak bundle
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: clipperino.flatpak
          manifest-path: build-aux/flatpak/io.github.djshiye.Clipperino.yml
          cache-key: flatpak-builder-${{ github.sha }}

  flatpak-upload:
    name: Attach Flatpak bundle
    needs: [flatpak, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: clipperino-x86_64.flatpak
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mv clipperino.flatpak "clipperino-$VERSION.x86_64.flatpak"
          gh release upload "$GITHUB_REF_NAME" "clipperino-$VERSION.x86_64.flatpak" \
            --repo "$GITHUB_REPOSITORY"

  dnf-repo:
    name: Update dnf repository
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/repo.yml
