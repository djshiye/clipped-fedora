name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  fedora:
    name: Build and test (Fedora ${{ matrix.release }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ["44", "rawhide"]
    container:
      image: fedora:${{ matrix.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y rust cargo clippy rustfmt meson ninja-build gcc \
            gtk4-devel libadwaita-devel sqlite-devel blueprint-compiler \
            desktop-file-utils appstream gettext rpm-build rpmdevtools rpmlint \
            cargo-rpm-macros python3 tar xz

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test

      - name: Meson build and validation tests
        run: |
          meson setup builddir
          meson compile -C builddir
          meson test -C builddir --print-errorlogs
          DESTDIR="$PWD/stage" meson install -C builddir

      - name: Build RPM
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          # Build everything outside the checkout: tar refuses to archive a
          # directory that changes while it is read (its own output landing in it).
          DIST="$RUNNER_TEMP/dist"; mkdir -p "$DIST"
          cargo vendor --locked "$DIST/vendor" > /dev/null
          tar -C "$DIST" -cJf "$DIST/clipperino-${VERSION}-vendor.tar.xz" vendor
          tar --no-wildcards-match-slash \
              --exclude=./target --exclude=./builddir --exclude=./stage --exclude=./.git --exclude=./spikes \
              --transform "s,^\./,clipperino-${VERSION}/," -czf "$DIST/clipperino-${VERSION}.tar.gz" .
          rpmdev-setuptree
          cp "$DIST"/clipperino-${VERSION}*.tar.* ~/rpmbuild/SOURCES/
          rpmbuild -ba build-aux/clipperino.spec
          rpmlint build-aux/clipperino.spec ~/rpmbuild/RPMS/x86_64/clipperino-*.rpm

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: clipperino-rpm-fedora-${{ matrix.release }}
          path: ~/rpmbuild/RPMS/x86_64/clipperino-*.rpm
          if-no-files-found: error

      # The spec downloads these from the release (Source0, Source1).
      - name: Upload source tarballs
        if: matrix.release == '44'
        uses: actions/upload-artifact@v4
        with:
          name: clipperino-sources
          path: ~/rpmbuild/SOURCES/clipperino-*.tar.*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: fedora
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: false

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Notes: this version's section of CHANGELOG.md.
          awk -v v="$VERSION" '
            $0 ~ "^## " v " " {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG.md section for $VERSION"; exit 1; }
          mkdir upload
          cp assets/clipperino-sources/* upload/
          # Fedora 44 is the supported release; Rawhide builds stay CI-only.
          cp assets/clipperino-rpm-fedora-44/*.rpm upload/
          gh release create "$GITHUB_REF_NAME" upload/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Clipperino $VERSION" \
            --notes-file notes.md

  dnf-repo:
    name: Update dnf repository
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/repo.yml
